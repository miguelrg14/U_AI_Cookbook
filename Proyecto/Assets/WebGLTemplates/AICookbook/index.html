<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* The player fills the whole window and follows its size (Unity's default template uses a fixed 960x600 box). */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #11131b; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #11131b; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 18px; font: 600 28px/1.2 system-ui, sans-serif; color: #fff; }
      #loading small { font-weight: 400; font-size: 15px; color: #c4cad8; }
      #bar { width: min(360px, 70vw); height: 6px; border-radius: 3px; background: #202432; overflow: hidden; }
      #bar-fill { width: 0; height: 100%; background: #6ecda5; transition: width 0.15s; }
      #message { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: 90vw; padding: 10px 16px;
                 border-radius: 6px; background: #3a2030; color: #fff; font: 14px system-ui, sans-serif; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      {{{ PRODUCT_NAME }}}
      <div id="bar"><div id="bar-fill"></div></div>
      <small>Best played on desktop with keyboard and mouse</small>
    </div>
    <div id="message"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var barFill = document.querySelector("#bar-fill");

      function showMessage(text, type) {
        if (type !== "error") { console.log(text); return; }
        var message = document.querySelector("#message");
        message.textContent = text;
        message.style.display = "block";
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if typeof CODE_FILENAME !== "undefined" && CODE_FILENAME
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if typeof MEMORY_FILENAME !== "undefined" && MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if typeof SYMBOLS_FILENAME !== "undefined" && SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showMessage,
        // Sharp on high-DPI screens without rendering huge buffers
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          barFill.style.width = (100 * progress) + "%";
        }).then(function () {
          loading.style.display = "none";
          canvas.focus();
        }).catch(function (error) {
          showMessage(String(error), "error");
        });
      };
      document.body.appendChild(script);

      // Keyboard input goes to the game as soon as the player clicks it (also inside an itch.io iframe)
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });
    </script>
  </body>
</html>
